<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <title>Bank viewer · 3d-object-world</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d1b19; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
      #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
      canvas#gl { max-width: 100vw; max-height: 100vh; aspect-ratio: auto; }
      #sheet { display: none; }
      #info { position: fixed; left: 8px; bottom: 6px; opacity: 0.7; white-space: pre; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="gl"></canvas></div>
    <canvas id="sheet"></canvas>
    <div id="info"></div>
    <script type="module" src="/src/viewer.js"></script>
  </body>
</html>
